<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CropGuard AI</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #eef8ed;
  margin: 0;
  color: #183b25;
}
header {
  background: #176b38;
  color: white;
  text-align: center;
  padding: 24px;
}
main {
  max-width: 600px;
  margin: 25px auto;
  padding: 20px;
  background: white;
  border-radius: 16px;
}
input, select, button {
  width: 100%;
  padding: 13px;
  margin: 12px 0;
  box-sizing: border-box;
  border-radius: 8px;
}
button {
  background: #176b38;
  color: white;
  border: 0;
  font-size: 17px;
}
img {
  max-width: 100%;
  max-height: 250px;
  display: block;
  margin: 15px auto;
  border-radius: 12px;
}
#result {
  background: #e7f5e8;
  padding: 15px;
  border-radius: 10px;
  display: none;
}
</style>
</head>
<body>

<header>
<h1>🌱 CropGuard AI</h1>
<p>Smart Farming, Healthy Crops, Better Future</p>
</header>

<main>
<h2>🌿 Plant Disease Assistant</h2>
<p>Upload a plant leaf photograph to begin.</p>

<input type="file" id="photo" accept="image/*">
<img id="preview" style="display:none">

<label>Select your crop:</label>
<select id="crop">
<option value="">Choose crop</option>
<option>Tomato</option>
<option>Rice</option>
<option>Cotton</option>
<option>Chilli</option>
<option>Potato</option>
</select>

<label>What symptoms do you observe?</label>
<select id="symptom">
<option value="">Choose symptoms</option>
<option value="spots">Brown or black spots</option>
<option value="yellow">Yellow leaves</option>
<option value="white">White powder on leaves</option>
<option value="curl">Curled leaves</option>
</select>

<button onclick="diagnose()">🔍 Check Plant Health</button>

<div id="result"></div>
</main>

<script>
const photo = document.getElementById("photo");

photo.addEventListener("change", function() {
  const file = this.files[0];
  if(file) {
    const preview = document.getElementById("preview");
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  }
});

function diagnose() {
  const crop = document.getElementById("crop").value;
  const symptom = document.getElementById("symptom").value;
  const result = document.getElementById("result");

  if(!crop || !symptom || !photo.files.length) {
    alert("Please upload a photo, select a crop and choose symptoms.");
    return;
  }

  const information = {
    spots: ["Possible leaf spot disease",
      "Brown or black spots may indicate a fungal or bacterial problem.",
      "Remove severely affected leaves, avoid wetting foliage and seek local agricultural advice."],
    yellow: ["Possible nutrient deficiency or root stress",
      "Yellowing can have several causes, including nutrient or water problems.",
      "Check soil moisture and drainage and seek soil testing before applying fertilizers."],
    white: ["Possible powdery mildew",
      "White powder-like patches can be a sign of fungal infection.",
      "Improve airflow and ask an agricultural expert about suitable management."],
    curl: ["Possible leaf curl problem",
      "Leaf curling may be linked to pests, viruses or environmental stress.",
      "Inspect for insects, isolate affected plants where practical and consult an agricultural expert."]
  };

  const data = information[symptom];

  result.style.display = "block";
  result.innerHTML = `
    <h2>🌱 Plant Health Report</h2>
    <p><b>Crop:</b> ${crop}</p>
    <p><b>Possible issue:</b> ${data[0]}</p>
    <p><b>Information:</b> ${data[1]}</p>
    <p><b>Suggested action:</b> ${data[2]}</p>
    <hr>
    <b>Note:</b> This is a symptom-based educational prototype,
    not an AI image diagnosis. Confirm the problem with an agricultural expert.
  `;
}
</script>

</body>
</html>
